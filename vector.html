<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Illustration Gallery - Muhamad Danu</title>

    <!-- Inter web font -->
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS Play CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Tailwind Configuration -->
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
      @theme {
        --default-font-family: "Inter";
      }
    </style>

    <!-- Alpine.js -->
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>
  <body class="antialiased">
    <!-- Page Container -->
    <div
      x-data="{
        darkMode: false,
        toggleDarkMode() {
          this.darkMode = ! this.darkMode;
          if (this.darkMode) {
            document.body.parentNode.classList.add('dark');
          } else {
            document.body.parentNode.classList.remove('dark');
          }
        }
      }"
      class="min-h-dvh min-w-80 bg-white text-zinc-800 dark:bg-zinc-950 dark:text-zinc-100"
    >
      <main
        id="page-content"
        class="mx-auto flex max-w-6xl flex-auto flex-col px-4 pb-12 lg:px-8"
      >
        <!-- Header / Navigation -->
        <header class="flex items-center justify-between py-7">
          <div class="flex items-center gap-4">
            <!-- Tombol Kembali ke Beranda -->
            <a
              href="index.html"
              class="inline-flex items-center gap-2 rounded-lg bg-zinc-100 px-4 py-2 text-sm font-medium hover:bg-zinc-200 dark:bg-zinc-900 dark:hover:bg-zinc-800"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                class="size-4"
              >
                <path
                  fill-rule="evenodd"
                  d="M11.03 3.97a.75.75 0 0 1 0 1.06l-6.22 6.22H21a.75.75 0 0 1 0 1.5H4.81l6.22 6.22a.75.75 0 1 1-1.06 1.06l-7.5-7.5a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 0 1 1.06 0Z"
                  clip-rule="evenodd"
                />
              </svg>
              Kembali
            </a>
            <span class="text-zinc-300 dark:text-zinc-700">|</span>
            <a href="index.html" class="text-xl font-thin tracking-widest">
              Muhamad Danu
            </a>
          </div>

          <!-- Toggle Dark Mode -->
          <button
            x-on:click="toggleDarkMode()"
            type="button"
            class="relative inline-flex size-9 items-center justify-center text-zinc-600 hover:opacity-75 dark:text-zinc-400"
          >
            <div
              x-cloak
              x-show="!darkMode"
              class="absolute inset-0 flex items-center justify-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                />
              </svg>
            </div>
            <div
              x-cloak
              x-show="darkMode"
              class="absolute inset-0 flex items-center justify-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
                />
              </svg>
            </div>
          </button>
        </header>

        <!-- Judul Kategori -->
        <div class="my-8">
          <h1 class="text-3xl font-semibold text-zinc-900 dark:text-zinc-50">
            Vector Portfolio
          </h1>
          <p class="mt-2 text-zinc-600 dark:text-zinc-400">
            Kumpulan hasil karya ilustrasi, digital painting, dan manipulasi foto.
          </p>
        </div>

        <!-- Grid Karya (Kotak-Kotak Hasil Karya Otomatis dari CMS) -->
        <div id="vector-container" class="grid grid-cols-1 gap-6 sm:grid-cols-2 md:grid-cols-3">
          <!-- Data dari CMS akan di-render otomatis di sini lewat portfolio-loader.js -->
        </div>

        <!-- Footer Sederhana -->
        <footer class="mt-16 text-center text-sm text-zinc-500 dark:text-zinc-400">
          Muhamad Danu © <span x-text="new Date().getFullYear()"></span>
        </footer>
      </main>
    </div>

    <!-- Script Fetch Data CMS -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="portfolio-loader.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        loadPortfolio('vector', 'vector-container');
      });
    </script>

  </body>
</html>
