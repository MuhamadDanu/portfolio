<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager - Portfolio Admin</title>
    <link href="config.yml?v=2" type="text/yaml" rel="cms-config-url" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Inisialisasi Netlify Identity
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.reload();
            });
          }
        });
      }

      // Custom Preview biar rapi tanpa teks "Deskripsi / Tools:"
      var PortfolioPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title']);
          var software = entry.getIn(['data', 'software']);
          var image = this.props.getAsset(entry.getIn(['data', 'image']));

          return h('div', { style: { padding: '20px', fontFamily: 'sans-serif' } },
            image ? h('img', { src: image.toString(), style: { maxWidth: '100%', borderRadius: '8px', marginBottom: '12px' } }) : null,
            h('h3', { style: { margin: '0 0 6px 0', fontSize: '18px', fontWeight: 'bold' } }, title),
            h('p', { style: { margin: 0, color: '#666', fontSize: '14px' } }, software)
          );
        }
      });

      // Pasang preview ini ke semua koleksi
      CMS.registerPreviewTemplate("banner", PortfolioPreview);
      CMS.registerPreviewTemplate("logo", PortfolioPreview);
      CMS.registerPreviewTemplate("vector", PortfolioPreview);
      CMS.registerPreviewTemplate("illustration", PortfolioPreview);
      CMS.registerPreviewTemplate("brand", PortfolioPreview);
      CMS.registerPreviewTemplate("editing", PortfolioPreview);
      CMS.registerPreviewTemplate("sertifikat", PortfolioPreview);
    </script>
  </body>
</html>
