backend:
  name: git-gateway
  site_domain: muhamaddanu.netlify.app
  branch: main

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "banner"
    label: "Desain Banner"
    folder: "content/banner"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Banner", name: "image", widget: "image", media_folder: "/assets_banner", public_folder: "assets_banner" }

  - name: "logo"
    label: "Desain Logo"
    folder: "content/logo"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Logo", name: "image", widget: "image", media_folder: "/assets_logo", public_folder: "assets_logo" }

  - name: "vector"
    label: "Vektor Wajah / Wpap"
    folder: "content/vector"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Vektor", name: "image", widget: "image", media_folder: "/assets_vektor", public_folder: "assets_vektor" }

  - name: "illustration"
    label: "Illustrasi Karakter"
    folder: "content/illustration"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Ilustrasi", name: "image", widget: "image", media_folder: "/assets_illustration", public_folder: "assets_illustration" }

  - name: "brand"
    label: "Identitas Brand"
    folder: "content/brand"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Brand/Poster", name: "image", widget: "image", media_folder: "/assets_poster", public_folder: "assets_poster" }

  - name: "editing"
    label: "Photo Editing"
    folder: "content/editing"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Editing", name: "image", widget: "image", media_folder: "/assets_editing", public_folder: "assets_editing" }