backend:
  name: git-gateway
  site_domain: muhamaddanu.netlify.app
  branch: main

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "banner"
    label: "Banner & Carousel"
    folder: "content/banner"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Banner", name: "image", widget: "image", media_folder: "/assets_banner" }

  - name: "editing"
    label: "Photo Editing"
    folder: "content/editing"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Hasil Editing", name: "image", widget: "image", media_folder: "/assets_editing" }

  - name: "illustration"
    label: "Illustration"
    folder: "content/illustration"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Ilustrasi", name: "image", widget: "image", media_folder: "/assets_illustration" }

  - name: "logo"
    label: "Logo Design"
    folder: "content/logo"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Logo", name: "image", widget: "image", media_folder: "/assets_logo" }

  - name: "poster"
    label: "Poster Design"
    folder: "content/poster"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Poster", name: "image", widget: "image", media_folder: "/assets_poster" }

  - name: "vector"
    label: "Vector Design"
    folder: "content/vector"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Deskripsi / Tools", name: "description", widget: "string" }
      - { label: "Foto Vektor", name: "image", widget: "image", media_folder: "/assets_vektor" }

  - name: "sertifikat"
    label: "Sertifikat"
    folder: "content/sertifikat"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Sertifikat", name: "title", widget: "string" }
      - { label: "Penerbit", name: "issuer", widget: "string" }
      - { label: "Gambar Sertifikat", name: "image", widget: "image" }
      - { label: "Deskripsi", name: "description", widget: "text", required: false }